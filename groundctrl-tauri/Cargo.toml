[package]
name = "groundctrl-tauri"
version = "0.1.0"
description = "Ground Control Station - Tauri desktop (Web/HTML) frontend"
authors = ["groundctrl"]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
groundctrl-core = { path = "../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
