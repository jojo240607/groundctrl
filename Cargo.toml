[workspace]
resolver = "2"
members = [
    "core",
    "ui-desktop",
    "tools",
    "groundctrl-tauri",
]
exclude = ["tmp_probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
num-traits = "0.2"
# 项目共用 MAVLink 模块（固件 flyctrl-core / 仿真器 fly-simulater / 本地地面站共用，
# 统一消息编解码，避免各端各自维护一份导致字段顺序 / CRC 不一致）
mavlink-core = { path = "../mavlink-core" }
