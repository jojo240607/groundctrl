[workspace]
resolver = "2"
members = [
    "core",
    "ui-desktop",
    "tools",
    "groundctrl-tauri",
]
exclude = ["tmp_probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
num-traits = "0.2"
mavlink = { version = "0.11", default-features = false, features = ["std", "common", "format-generated-code"] }
